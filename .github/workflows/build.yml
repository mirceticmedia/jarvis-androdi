name: Build Jarvis APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Publish as the "latest" release (easy download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Jarvis (latest)" --notes "Install Jarvis.apk on the phone."
          gh release upload latest Jarvis.apk --clobber
          gh release edit latest --notes "Build ${{ github.run_number }} - install Jarvis.apk on the phone."
